name: Public package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/qms.test.js
      - run: python -B -X utf8 -m unittest discover -s tests -p "test_*.py"
      - run: python -B -X utf8 tools/qms.py doctor
      - run: python -B -X utf8 tools/check_public.py
